name: Check Registry Updates
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  check-for-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout application repository
        uses: actions/checkout@v7
      - name: Set up Go
        # Read from go.mod so a toolchain bump here cannot silently break the
        # scheduled run.
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install dependencies
        run: go mod download
      - name: Clone registry repository
        # Anonymously. clipack-registry is public, so the clone needs no
        # credentials — and a token inside the URL is readable from the process
        # list while git runs, which is the one thing worth avoiding here.
        run: git clone https://github.com/lvim-tech/clipack-registry.git registry
      - name: Configure Git for registry
        # The token is needed for the PUSH, and it reaches git through a file
        # rather than a command line: 600, inside .git, gone with the runner.
        env:
          REGISTRY_TOKEN: ${{ secrets.CLIPACK }}
        run: |
          cd registry
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config credential.helper 'store --file=.git/credentials'
          install -m 600 /dev/null .git/credentials
          printf 'https://oauth2:%s@github.com\n' "$REGISTRY_TOKEN" > .git/credentials
      - name: Run check registry script
        # Through the environment rather than as an argument: an argument is
        # readable from the process list for as long as the step runs.
        env:
          GITHUB_TOKEN: ${{ secrets.CLIPACK }}
        run: go run scripts/check_registry.go
